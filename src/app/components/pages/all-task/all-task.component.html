
<h2 class="text-xl font-bold">My Day</h2>
  <div class="text-blue-600">{{datenow | date:'fullDate'}}</div>

  <div class="flex flex-col gap-4 mt-4">
    <input type="text" class="h-8 w-full rounded px-4 py-2 border-2 border-solid border-yellow-500 shadow-lg " placeholder="Add a new task"
    [(ngModel)]="newTask" />

    <button class="px-4 py-2 bg-blue-500 text-white rounded" (click)="test()">Add</button>
  </div>
  <h2 class="font-bold text-xl">Tasks</h2>

  @for (a of list; track a) {
    <div
    class="h-12 w-full bg-white rounded px-4 py-2 border-2 border-solid border-yellow-500 shadow-lg flex justify-between items-center mt-2 mb-2 pr-8">
    <p>
      {{ a }}
    </p>
    
    <div class="flex gap-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6 hover:cursor-pointer"
        
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6 hover:cursor-pointer"
        
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"
        />
      </svg>
    </div>
  </div>
  }

  <div class="flex flex-col gap-4 mt-4">
    <app-task-list [taskList]="taskList" ></app-task-list>
  </div>
